name: build

# Branch model:
#   dev   — where contributor PRs land and get verified together
#   main  — release line, only ever updated by a PR from dev
#
# Tests run on both. Packaging is expensive (three full Electron builds), so it
# only runs where the artifacts are actually wanted.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Icons are generated from source; fail if the committed PNGs drifted.
      - run: npm run icons:check

  # Smoke test that the app still packages. Runs on main and on demand, but not
  # on every pull request — three OS builds per PR would make review slow.
  package:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Tag builds publish straight to a draft GitHub Release.
  #
  # This uses electron-builder's --publish rather than uploading artifacts by
  # hand, because the in-app updater needs the metadata files electron-builder
  # generates alongside the installers (latest.yml, latest-mac.yml,
  # latest-linux.yml). Without those, auto-update silently never finds anything.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build and publish to draft release
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned; see README. Auto-update still works on
          # Windows and Linux, which don't require a signature.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Only flip the draft to published once all three platforms uploaded, so users
  # never see a release that's missing their installer — and, more importantly,
  # so the updater never sees a half-populated release.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "Published $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort
